name: Mirror Main Branch

on:
  push:
    branches:
      - main

jobs:
  sync-to-secondary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git Identity
        run: |
          git config --global user.email "dragwyb@gmail.com"
          git config --global user.name "Dragwyb"

      - name: Push to Secondary Account
        env:
          SEC_TOKEN: ${{ secrets.SECONDARY_REPO_TOKEN }}
        run: |
          # Push directly to the target URL using the token
          git push --force "https://${SEC_TOKEN}@github.com/Dragwyb/workflow-automate.git" main
